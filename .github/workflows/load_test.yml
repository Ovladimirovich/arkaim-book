name: Load Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Number of concurrent requests'
        required: false
        default: '10'
      requests:
        description: 'Total requests per test'
        required: false
        default: '50'

jobs:
  load_test:
    runs-on: ubuntu-latest

    services:
      core:
        image: python:3.14-slim
        options: >-
          --name core
          --health-cmd "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8642/health\")' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: runtime/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests httpx
        cd runtime && pip install -r requirements.txt && cd ..

    - name: Start services for testing
      run: |
        cd runtime
        python -m core.main &
        CORE_PID=$!
        echo "Core PID: $CORE_PID"

        for i in $(seq 1 30); do
          if curl -s http://127.0.0.1:8642/health > /dev/null 2>&1; then
            echo "Core is ready"
            break
          fi
          echo "Waiting for core... ($i/30)"
          sleep 2
        done

        echo "CORE_PID=$CORE_PID" >> $GITHUB_ENV
      env:
        SESSION_SECRET: test-secret-key
        AUTH_DB_PATH: ":memory:"

    - name: Run load test
      run: |
        cd scripts
        python load_test.py
      env:
        CONCURRENCY: ${{ github.event.inputs.concurrency || '10' }}
        TOTAL_REQUESTS: ${{ github.event.inputs.requests || '50' }}

    - name: Stop services
      if: always()
      run: |
        if [ -n "$CORE_PID" ]; then
          kill $CORE_PID 2>/dev/null || true
        fi

    - name: Upload load test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-results
        path: runtime/logs/
        retention-days: 7
