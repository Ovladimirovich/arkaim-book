name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]

jobs:
  # в”Ђв”Ђ Backend Tests в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: runtime/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd runtime && pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint with ruff
        run: |
          cd runtime
          ruff check .
          ruff format --check .

      - name: Run backend tests
        run: |
          cd runtime
          python -m pytest tests/ -v --tb=short
        env:
          SESSION_SECRET: test-secret-key
          AUTH_DB_PATH: ":memory:"

      - name: Run narrative engine tests
        run: |
          cd runtime
          python -m pytest tests/test_narrative_*.py -v --tb=short

  # в”Ђв”Ђ Frontend Tests в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: arkaim-web/package-lock.json

      - name: Install dependencies
        run: |
          cd arkaim-web
          npm ci

      - name: Lint with ESLint
        run: |
          cd arkaim-web
          npm run lint

      - name: Type check with tsc
        run: |
          cd arkaim-web
          npx tsc --noEmit

      - name: Run tests
        run: |
          cd arkaim-web
          npx vitest run

      - name: Build
        run: |
          cd arkaim-web
          npm run build

  # в”Ђв”Ђ Docker Build в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build -f Dockerfile.backend -t ghcr.io/Ovladimirovich/arkaim-backend:${{ github.sha }} .

      - name: Build frontend image
        run: |
          docker build -f Dockerfile.frontend -t ghcr.io/Ovladimirovich/arkaim-frontend:${{ github.sha }} .

      - name: Push backend image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/Ovladimirovich/arkaim-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push ghcr.io/Ovladimirovich/arkaim-frontend:${{ github.sha }}
