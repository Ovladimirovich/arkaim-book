<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Engine — Демонстрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid #e94560;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #a0a0a0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }
        
        .stat-value {
            font-size: 2em;
            color: #e94560;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #a0a0a0;
            margin-top: 5px;
        }
        
        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .section h2 {
            color: #e94560;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
            padding-bottom: 10px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1em;
        }
        
        .search-box button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            background: #e94560;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .search-box button:hover {
            background: #c73e54;
        }
        
        .results {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .result-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 3px solid #e94560;
        }
        
        .result-category {
            font-size: 0.8em;
            color: #e94560;
            text-transform: uppercase;
        }
        
        .result-name {
            font-size: 1.1em;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .result-description {
            font-size: 0.9em;
            color: #a0a0a0;
        }
        
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .category-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .category-item:hover {
            background: rgba(233, 69, 96, 0.2);
        }
        
        .category-count {
            font-size: 1.5em;
            color: #e94560;
            font-weight: bold;
        }
        
        .category-name {
            font-size: 0.9em;
            color: #a0a0a0;
        }
        
        .modes-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }
        
        .mode-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            padding: 15px;
            border-left: 3px solid #e94560;
        }
        
        .mode-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .mode-description {
            font-size: 0.85em;
            color: #a0a0a0;
        }
        
        .visual-prompt {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.9em;
            word-wrap: break-word;
            margin-top: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #a0a0a0;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            border-top: 1px solid rgba(233, 69, 96, 0.3);
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>World Engine</h1>
            <p class="subtitle">Вычислимая модель мира книги «Наследие Аркаима»</p>
        </header>
        
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-entities">-</div>
                <div class="stat-label">Сущностей</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-relations">-</div>
                <div class="stat-label">Связей</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-forms">-</div>
                <div class="stat-label">Форм</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-rules">-</div>
                <div class="stat-label">Правил</div>
            </div>
        </div>
        
        <div class="section">
            <h2>Поиск по миру</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Введите запрос (например: Аркаим, Гиперборея, технология)...">
                <button onclick="search()">Найти</button>
            </div>
            <div class="results" id="search-results"></div>
        </div>
        
        <div class="section">
            <h2>Категории мира</h2>
            <div class="categories-grid" id="categories"></div>
        </div>
        
        <div class="section">
            <h2>Режимы работы</h2>
            <div class="modes-list" id="modes"></div>
        </div>
        
        <div class="section">
            <h2>Визуальный промпт</h2>
            <div class="search-box">
                <input type="text" id="visual-input" placeholder="ID сущности (например: region_arkaim)">
                <button onclick="generateVisual()">Генерировать</button>
            </div>
            <div class="visual-prompt" id="visual-prompt">Введите ID сущности и нажмите "Генерировать"</div>
        </div>
        
        <footer>
            <p>World Engine — Наследие Аркаима © 2026</p>
        </footer>
    </div>
    
    <script>
        // API base URL
        const API_BASE = 'http://localhost:8642/book/world';
        
        // Load stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/summary`);
                const data = await response.json();
                
                document.getElementById('total-entities').textContent = data.stats.world_model.total_entities;
                document.getElementById('total-relations').textContent = data.stats.relation_graph.total_relations || '-';
                document.getElementById('total-forms').textContent = '55';
                document.getElementById('total-rules').textContent = '5';
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        // Search
        async function search() {
            const query = document.getElementById('search-input').value;
            if (!query) return;
            
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '<div class="loading">Поиск...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, limit: 10 })
                });
                const data = await response.json();
                
                if (data.total === 0) {
                    resultsDiv.innerHTML = '<div class="loading">Ничего не найдено</div>';
                    return;
                }
                
                let html = '';
                for (const item of data.world_model.slice(0, 10)) {
                    html += `
                        <div class="result-item">
                            <div class="result-category">${item.category}</div>
                            <div class="result-name">${item.name || item.id}</div>
                            <div class="result-description">${(item.description || '').substring(0, 150)}...</div>
                        </div>
                    `;
                }
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = '<div class="loading">Ошибка поиска</div>';
            }
        }
        
        // Load categories
        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE}/categories`);
                const data = await response.json();
                
                let html = '';
                for (const [cat, count] of Object.entries(data.categories)) {
                    html += `
                        <div class="category-item" onclick="searchCategory('${cat}')">
                            <div class="category-count">${count}</div>
                            <div class="category-name">${cat}</div>
                        </div>
                    `;
                }
                document.getElementById('categories').innerHTML = html;
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        
        // Search by category
        function searchCategory(category) {
            document.getElementById('search-input').value = category;
            search();
        }
        
        // Load modes
        async function loadModes() {
            try {
                const response = await fetch(`${API_BASE}/modes`);
                const data = await response.json();
                
                let html = '';
                for (const mode of data.modes) {
                    html += `
                        <div class="mode-item">
                            <div class="mode-name">${mode.name}</div>
                            <div class="mode-description">${mode.description}</div>
                        </div>
                    `;
                }
                document.getElementById('modes').innerHTML = html;
            } catch (error) {
                console.error('Error loading modes:', error);
            }
        }
        
        // Generate visual prompt
        async function generateVisual() {
            const entityId = document.getElementById('visual-input').value;
            if (!entityId) return;
            
            const promptDiv = document.getElementById('visual-prompt');
            promptDiv.textContent = 'Генерация...';
            
            try {
                const response = await fetch(`${API_BASE}/entity/${entityId}/visual-prompt?style=cinematic`);
                const data = await response.json();
                
                promptDiv.textContent = data.prompt || 'Промпт не сгенерирован';
            } catch (error) {
                promptDiv.textContent = 'Ошибка генерации';
            }
        }
        
        // Enter key for search
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') search();
        });
        
        // Load data on page load
        loadStats();
        loadCategories();
        loadModes();
    </script>
</body>
</html>
