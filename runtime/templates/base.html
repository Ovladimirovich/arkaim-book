<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Наследие Аркаима{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.0" defer></script>
  <link rel="stylesheet" href="/static/main.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <nav class="nav">
    <div class="nav-inner">
      <a href="/_ui/book" class="nav-logo">Наследие Аркаима</a>
      <div class="nav-links">
        <a href="/_ui/book" {% if active == 'book' %}class="active"{% endif %}>Книга</a>
        <a href="/_ui/about" {% if active == 'about' %}class="active"{% endif %}>О книге</a>
        <a href="/_ui/profile" {% if active == 'profile' %}class="active"{% endif %} id="navProfile">Профиль</a>
        <a href="/_ui/history" {% if active == 'history' %}class="active"{% endif %}>История</a>
        <a href="/_ui/upload" {% if active == 'upload' %}class="active"{% endif %} id="navUpload" style="display:none">Загрузить</a>
        <a href="/_ui/visual-genome" {% if active == 'visual-genome' %}class="active"{% endif %} id="navVisualGenome" style="display:none">Визуалы</a>
        <a href="/_ui/admin" {% if active == 'admin' %}class="active"{% endif %} id="navAdmin" style="display:none">Админ <span id="wsBadge" class="nav-badge" style="display:none"></span></a>
      </div>
      <div class="nav-user" id="navUser">
        <button class="nav-theme-toggle" onclick="toggleTheme()" title="Переключить тему" id="themeToggle">🌙</button>
        <span id="navUserName"></span>
        <a href="/auth/logout" class="btn-outline btn-sm">Выйти</a>
      </div>
    </div>
  </nav>
  <main class="main">{% block content %}{% endblock %}</main>
  <script src="/static/app.js" defer></script>
</body>
</html>
