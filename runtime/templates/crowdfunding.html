{% extends "base.html" %}
{% block title %}Краудфандинг — Наследие Аркаима{% endblock %}
{% block content %}
<div class="crowdfunding-layout">
  <section class="crowdfunding-hero">
    <h1>🎯 Поддержать проект</h1>
    <p>Помогите нам издать книгу «Наследие Аркаима» в печатном виде. Каждый рубль приближает нас к цели.</p>
    <a href="https://planeta.ru/project/arkaim-legacy" target="_blank" class="btn btn-primary">Перейти к кампании →</a>
  </section>

  <div id="campaigns-container" class="campaigns-grid">
    <!-- Campaigns will be loaded here -->
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p>Загрузка данных...</p>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const container = document.getElementById('campaigns-container');
  
  try {
    const resp = await fetch('/book/crowdfunding/status');
    const data = await resp.json();
    
    if (!data.campaigns || data.campaigns.length === 0) {
      container.innerHTML = '<p class="no-campaigns">Кампании не настроены</p>';
      return;
    }
    
    container.innerHTML = data.campaigns.map(campaign => renderCampaign(campaign)).join('');
  } catch (err) {
    container.innerHTML = `
      <div class="error-message">
        <p>⚠️ Не удалось загрузить данные</p>
        <p class="error-detail">${err.message}</p>
      </div>
    `;
  }
});

function renderCampaign(c) {
  const progressPercent = Math.min(c.progress_percent, 100);
  const isComplete = c.status === 'completed';
  const isCancelled = c.status === 'cancelled';
  
  return `
    <div class="campaign-card ${isComplete ? 'completed' : ''} ${isCancelled ? 'cancelled' : ''}">
      <div class="campaign-header">
        <h2>${c.title}</h2>
        <span class="campaign-status status-${c.status}">${getStatusText(c.status)}</span>
      </div>
      
      <a href="${c.url}" target="_blank" class="campaign-link">
        Перейти к кампании →
      </a>
      
      <!-- Прогресс-бар -->
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${progressPercent}%"></div>
      </div>
      <div class="progress-label">
        <span class="raised">${formatNumber(c.raised_amount)} ₽</span>
        <span class="separator">/</span>
        <span class="target">${formatNumber(c.target_amount)} ₽</span>
        <span class="percent">(${progressPercent.toFixed(1)}%)</span>
      </div>
      
      <!-- Статистика -->
      <div class="campaign-stats">
        <div class="stat-item">
          <span class="stat-icon">👥</span>
          <span class="stat-value">${c.backers_count}</span>
          <span class="stat-label">бэкеров</span>
        </div>
        ${c.days_remaining !== null ? `
        <div class="stat-item">
          <span class="stat-icon">📅</span>
          <span class="stat-value">${c.days_remaining}</span>
          <span class="stat-label">дней осталось</span>
        </div>
        ` : ''}
      </div>
      
      <!-- Майлстоуны -->
      <div class="milestones-section">
        <h3>🎯 Майлстоуны</h3>
        <div class="milestones">
          ${c.milestones.map(m => `
            <div class="milestone ${m.reached ? 'reached' : ''}">
              <div class="milestone-bar">
                <div class="milestone-fill" style="width: ${Math.min(c.progress_percent, 100)}%"></div>
              </div>
              <div class="milestone-info">
                <span class="milestone-percent">${m.percent}%</span>
                <span class="milestone-amount">${formatNumber(m.amount)} ₽</span>
                ${m.reached ? `<span class="milestone-reached">✅ ${formatDate(m.reached_at)}</span>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      
      ${c.error ? `<div class="campaign-error">⚠️ ${c.error}</div>` : ''}
      ${c.last_checked ? `<div class="campaign-meta">Обновлено: ${formatDate(c.last_checked)}</div>` : ''}
    </div>
  `;
}

function getStatusText(status) {
  const map = {
    'active': '🟢 Сбор',
    'completed': '✅ Завершён',
    'cancelled': '❌ Отменён',
    'error': '⚠️ Ошибка'
  };
  return map[status] || status;
}

function formatNumber(num) {
  if (!num) return '0';
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function formatDate(isoString) {
  if (!isoString) return '';
  const d = new Date(isoString);
  return d.toLocaleDateString('ru-RU', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
}
</script>

<style>
.crowdfunding-layout {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem;
}

.crowdfunding-hero {
  text-align: center;
  margin-bottom: 3rem;
}

.crowdfunding-hero h1 {
  font-size: 2.5rem;
  margin-bottom: 1rem;
}

.crowdfunding-hero p {
  font-size: 1.2rem;
  color: #666;
  margin-bottom: 2rem;
}

.campaigns-grid {
  display: grid;
  gap: 2rem;
}

.campaign-card {
  background: white;
  border-radius: 12px;
  padding: 2rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: transform 0.2s;
}

.campaign-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}

.campaign-card.completed {
  border-left: 4px solid #4CAF50;
}

.campaign-card.cancelled {
  border-left: 4px solid #f44336;
  opacity: 0.7;
}

.campaign-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}

.campaign-header h2 {
  font-size: 1.5rem;
  margin: 0;
}

.campaign-status {
  padding: 0.25rem 0.75rem;
  border-radius: 20px;
  font-size: 0.875rem;
  font-weight: 600;
}

.status-active {
  background: #e8f5e9;
  color: #2e7d32;
}

.status-completed {
  background: #e3f2fd;
  color: #1565c0;
}

.status-cancelled {
  background: #ffebee;
  color: #c62828;
}

.status-error {
  background: #fff3e0;
  color: #ef6c00;
}

.campaign-link {
  display: inline-block;
  margin-bottom: 1.5rem;
  color: #1976d2;
  text-decoration: none;
  font-weight: 500;
}

.campaign-link:hover {
  text-decoration: underline;
}

.progress-bar {
  height: 24px;
  background: #e0e0e0;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 0.5rem;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #4CAF50, #66BB6A);
  transition: width 0.5s ease;
}

.campaign-card.cancelled .progress-fill {
  background: #f44336;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  font-size: 1.1rem;
}

.raised {
  font-weight: 700;
  color: #2e7d32;
}

.target {
  color: #666;
}

.percent {
  color: #999;
  font-weight: 500;
}

.campaign-stats {
  display: flex;
  gap: 2rem;
  margin-bottom: 2rem;
  padding: 1rem;
  background: #f5f5f5;
  border-radius: 8px;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.stat-icon {
  font-size: 1.5rem;
}

.stat-value {
  font-size: 1.25rem;
  font-weight: 700;
}

.stat-label {
  color: #666;
  font-size: 0.875rem;
}

.milestones-section h3 {
  font-size: 1.1rem;
  margin-bottom: 1rem;
  color: #333;
}

.milestones {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.milestone {
  position: relative;
}

.milestone-bar {
  height: 8px;
  background: #e0e0e0;
  border-radius: 4px;
  overflow: hidden;
}

.milestone-fill {
  height: 100%;
  background: #1976d2;
  transition: width 0.3s ease;
}

.milestone.reached .milestone-fill {
  background: #4CAF50;
}

.milestone-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 0.25rem;
  font-size: 0.875rem;
}

.milestone-percent {
  font-weight: 600;
  color: #1976d2;
}

.milestone.reached .milestone-percent {
  color: #2e7d32;
}

.milestone-amount {
  color: #666;
}

.milestone-reached {
  color: #4CAF50;
  font-weight: 500;
}

.campaign-error {
  margin-top: 1rem;
  padding: 0.75rem;
  background: #fff3e0;
  border-radius: 6px;
  color: #ef6c00;
  font-size: 0.875rem;
}

.campaign-meta {
  margin-top: 0.75rem;
  font-size: 0.75rem;
  color: #999;
  text-align: right;
}

.loading-spinner {
  text-align: center;
  padding: 3rem;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #e0e0e0;
  border-top-color: #1976d2;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 1rem;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.no-campaigns {
  text-align: center;
  color: #999;
  font-size: 1.1rem;
  padding: 3rem;
}

.error-message {
  text-align: center;
  padding: 2rem;
  background: #ffebee;
  border-radius: 8px;
  color: #c62828;
}

.error-detail {
  font-size: 0.875rem;
  color: #666;
  margin-top: 0.5rem;
}

@media (max-width: 768px) {
  .crowdfunding-layout {
    padding: 1rem;
  }
  
  .campaign-card {
    padding: 1.5rem;
  }
  
  .campaign-stats {
    flex-direction: column;
    gap: 1rem;
  }
  
  .milestone-info {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.25rem;
  }
}
</style>
{% endblock %}
